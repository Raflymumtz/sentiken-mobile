databases:
  - name: sentiken-db
    plan: free
    databaseName: sentiken
    user: sentiken

services:
  - type: web
    name: sentiken-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: sentiken-db
          property: connectionString
      - key: JOB_EXECUTION_MODE
        value: inline
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_FULL_NAME
        value: Administrator SENTIKEN
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
    dockerCommand: >
      sh -c "python -m alembic upgrade head &&
             python -m scripts.create_admin &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
